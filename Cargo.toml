[workspace]
resolver = "2"
members = [
    "libs/rosu-memory-lib",
    "libs/rosu-memory-macros",
]

[workspace.package]
version = "1.3.1"
edition = "2021"
authors = ["Glubus", "486c"]
license = "MIT"
repository = "https://github.com/Glubus/rosu-memory-lib"

[workspace.dependencies]
rosu-mem = "3.0.0"
rosu-mods = "0.3.1"
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = "1"
